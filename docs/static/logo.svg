  <!-- Drive activity LEDs -->
  <circle cx="58" cy="42" r="2.2" fill="#93c5fd"/>
  <circle cx="92" cy="42" r="2.2" fill="#93c5fd"/>
  <circle cx="58" cy="68" r="2.2" fill="#93c5fd"/>
  <circle cx="92" cy="68" r="2.2" fill="#93c5fd"/>
  <!-- Beard -->
  <path d="M43,79 L54,79 Q64,86 74,79 L85,79 C86,90 82,101 74,107 Q64,113 54,107 C46,101 42,90 43,79 Z" fill="#d97706"/>
