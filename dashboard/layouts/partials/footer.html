<footer class="bg-gray-50 dark:bg-gray-800 text-gray-400 dark:text-gray-400 m-4">
    <div class="w-full max-w-screen-xl mx-auto p-4 md:py-8">
        <div class="flex flex-wrap justify-center sm:justify-between">
            <a href="{{ "/" | relURL }}" class="flex items-center mb-4 sm:mb-0 space-x-3 text-xl font-semibold text-gray-900 dark:text-white">
                {{ .Site.Params.logo_text }} &middot; {{ .Site.Params.hostname }}
            </a>
            <ul class="flex flex-wrap justify-around items-center mb-6 text-sm font-medium text-gray-500 sm:mb-0 dark:text-gray-400">
                {{ range .Site.Data.footer.links }}
                <li>
                    <a href="{{ .href | relURL }}" class="hover:text-gray-900 dark:hover:text-white mx-4"{{ if .external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .name }}</a>
                </li>
                {{ end }}
            </ul>
        </div>
        <hr class="my-6 border-gray-200 sm:mx-auto dark:border-gray-700 lg:my-8" />
        {{ partial "contact-info.html" . }}
        <span class="block text-sm text-gray-500 sm:text-center dark:text-gray-400 mt-4">
            {{ .Site.Params.hostname }} &mdash; home NAS dashboard.
        </span>
    </div>
</footer>
