name: Build and release installer ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build installer ISO
        # --impure: hosts/installer/configuration.nix checks for a local
        # secrets/extra-files/.../authorized_keys to bake in (see its own
        # comment), and hosts/installer/installer-image.nix similarly
        # checks secrets/nas-secrets-usb/ for real (non-.example) files to
        # bake onto the appended NAS-SECRETS partition — neither path
        # exists on this runner, so both just produce their empty/no-key
        # defaults. Every ISO built by this workflow ships with no
        # baked-in key and an empty NAS-SECRETS partition, same as the
        # stock NixOS ISO plus a ready-to-use (but blank) secrets volume:
        # passwd-then-SSH at the console, one of the wizard's own
        # Secrets-step options, or just dropping files onto the
        # NAS-SECRETS drive before boot.
        run: nix build --impure --print-build-logs '.#packages.x86_64-linux.installer-iso'

      - name: Stage release asset
        # result is now a single file (hosts/installer/installer-image.nix's
        # own $out), not a directory with an iso/ subfolder like the plain
        # system.build.isoImage output used to be.
        run: cp result "beardednas-installer-${GITHUB_REF_NAME}.iso"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: beardednas-installer-*.iso
          generate_release_notes: true
